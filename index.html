<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olivier Vanacker | Customer Ops, RevOps and Product Ops</title>
<meta name="description" content="Olivier Vanacker. Customer operations, RevOps and product operations for startups and scale-ups. Based in Belgium, open to remote or hybrid.">
<meta name="theme-color" content="#1e1b4b">
<meta property="og:title" content="Olivier Vanacker">
<meta property="og:description" content="Customer operations, RevOps and product operations for startups and scale-ups. Based in Belgium.">
<meta property="og:url" content="https://raketlander.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg-base: #140f2e;
    --ink: #f5f3ff;
    --ink-soft: #ddd6fe;
    --accent: #a78bfa;
    --accent-hover: #f5f3ff;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.25rem;
    background-color: var(--bg-base);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
    overflow-x: hidden;
  }

  /* ---------- moving background ---------- */

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background-color: var(--bg-base);
  }

  .bg .layer {
    position: absolute;
    inset: -20%;
  }

  /* slow diagonal drift between deep indigo, violet and navy */
  .layer-a {
    background: linear-gradient(
      115deg,
      #1e1b4b 0%,
      #2e1065 22%,
      #4c1d95 42%,
      #172554 68%,
      #1e1b4b 100%
    );
    background-size: 300% 300%;
    animation: drift 26s ease-in-out infinite alternate;
  }

  /* soft colour glows breathing at low opacity */
  .layer-b {
    background:
      radial-gradient(42% 42% at 18% 22%, rgba(167, 139, 250, 0.13), transparent 70%),
      radial-gradient(36% 36% at 82% 74%, rgba(56, 189, 248, 0.09), transparent 70%),
      radial-gradient(40% 40% at 62% 12%, rgba(192, 132, 252, 0.09), transparent 70%);
    mix-blend-mode: screen;
    animation: glow 34s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from {
      background-position: 0% 50%;
    }
    to {
      background-position: 100% 50%;
    }
  }

  @keyframes glow {
    from {
      transform: translate3d(-4%, 2%, 0) scale(1.05);
    }
    to {
      transform: translate3d(4%, -3%, 0) scale(1.18);
    }
  }

  /* ---------- content ---------- */

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 46rem;
  }

  h1 {
    margin: 0 0 1.25rem;
    font-size: clamp(2.25rem, 11vw, 5.5rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 0.98;
    text-wrap: balance;
  }

  /* ---------- glitch on the name ---------- */

  .glitch {
    position: relative;
    display: inline-block;
  }

  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    text-align: center;
    pointer-events: none;
    opacity: 0;
  }

  .glitch::before {
    color: #67e8f9;
    animation: glitch-a 7s steps(1, end) infinite;
  }

  .glitch::after {
    color: #f0abfc;
    animation: glitch-b 8.3s steps(1, end) infinite;
  }

  @keyframes glitch-a {
    0%, 90% {
      opacity: 0;
      clip-path: inset(0 0 0 0);
      transform: none;
    }
    91% {
      opacity: 1;
      clip-path: inset(6% 0 64% 0);
      transform: translate3d(-4px, -2px, 0);
    }
    92.5% {
      opacity: 1;
      clip-path: inset(46% 0 30% 0);
      transform: translate3d(4px, 1px, 0);
    }
    94% {
      opacity: 1;
      clip-path: inset(74% 0 4% 0);
      transform: translate3d(-3px, 2px, 0);
    }
    95.5%, 100% {
      opacity: 0;
      clip-path: inset(0 0 0 0);
      transform: none;
    }
  }

  @keyframes glitch-b {
    0%, 86% {
      opacity: 0;
      clip-path: inset(0 0 0 0);
      transform: none;
    }
    87% {
      opacity: 1;
      clip-path: inset(70% 0 8% 0);
      transform: translate3d(3px, 1px, 0);
    }
    88.5% {
      opacity: 1;
      clip-path: inset(22% 0 52% 0);
      transform: translate3d(-4px, -1px, 0);
    }
    90%, 100% {
      opacity: 0;
      clip-path: inset(0 0 0 0);
      transform: none;
    }
  }

  /* ---------- text blocks ---------- */

  .lede {
    margin: 0 auto 1.75rem;
    max-width: 34rem;
    font-size: clamp(1.05rem, 2.6vw, 1.4rem);
    font-weight: 600;
    line-height: 1.45;
    text-wrap: balance;
  }

  .meta {
    margin: 0 auto 0.4rem;
    max-width: 34rem;
    color: var(--ink-soft);
    font-size: clamp(0.95rem, 2.1vw, 1.05rem);
    font-weight: 400;
    line-height: 1.5;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.85rem 1.5rem;
    margin: 2.75rem 0 0;
    padding: 0;
    list-style: none;
  }

  .links a {
    color: var(--accent);
    font-size: clamp(1rem, 2.4vw, 1.2rem);
    font-weight: 800;
    text-decoration: none;
    padding-bottom: 3px;
    border-bottom: 2px solid transparent;
  }

  .links a:hover,
  .links a:focus-visible {
    color: var(--accent-hover);
    border-bottom-color: var(--accent-hover);
  }

  .links a:focus-visible {
    outline: 3px solid var(--accent-hover);
    outline-offset: 4px;
    border-radius: 2px;
  }

  /* ---------- accessibility: calm everything down ---------- */

  @media (prefers-reduced-motion: reduce) {
    .layer-a,
    .layer-b,
    .glitch::before,
    .glitch::after {
      animation: none;
    }

    .glitch::before,
    .glitch::after {
      opacity: 0;
    }

    .layer-a {
      background-position: 30% 50%;
    }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="layer layer-a"></div>
    <div class="layer layer-b"></div>
  </div>

  <main>
    <h1><span class="glitch" data-text="Olivier Vanacker">Olivier Vanacker</span></h1>

    <p class="lede">At the intersection of customer operations, product thinking and AI automation.</p>
    <p class="meta">Based in Belgium. Remote, on-site or hybrid.</p>

    <ul class="links">
      <li>
        <a href="mailto:olivier@raketlander.com">olivier@raketlander.com</a>
      </li>
      <li>
        <a href="https://www.linkedin.com/in/olivier-v-03830b68" target="_blank" rel="noopener">
          LinkedIn
        </a>
      </li>
    </ul>
  </main>


</body>
</html>
